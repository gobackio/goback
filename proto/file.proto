syntax = "proto3";

package proto;

option go_package = "github.com/gobackio/goback/proto";

import "ref.proto";
import "encryption.proto";

// NodeType says what kind of filesystem entry a tree node describes.
enum NodeType {
	NODE_FILE = 0;
	NODE_DIRECTORY = 1;
	NODE_SYMLINK = 2;
}

// this contains file metadata, which can be different
// accross backups, even if file content is the same
// Name, user, group and link_target are plaintext bytes in an unencrypted
// store and deterministic tokens under the store key otherwise.
message FileInfo {
	bytes name = 1;
	uint32 mode = 2;
	bytes user = 3;
	bytes group = 4;
	reserved 5, 7;
	reserved "timestamp", "tree";
	int64 size = 6;

	// modification time in nanoseconds since the Unix epoch
	int64 mtime_ns = 8;
	NodeType type = 9;

	// the target of a symlink, empty for every other type
	bytes link_target = 10;

	// the fields below are recorded on Windows and 0 or empty elsewhere

	// change time in nanoseconds since the Unix epoch, which moves when the
	// content, a stream, the security descriptor or the attributes change
	int64 ctime_ns = 11;
	// creation time in nanoseconds since the Unix epoch
	int64 birthtime_ns = 12;
	// the FILE_ATTRIBUTE_* flags
	uint32 attributes = 13;
	// a File object holding the self-relative security descriptor, one
	// object for every entry with the same descriptor
	Ref security = 14;
	// the alternate data streams, by name
	repeated Stream streams = 15;
	// the tag of a reparse point that is not a symlink, such as a cloud
	// placeholder
	uint32 reparse_tag = 16;

	// the entry's content, or a directory's listing, is gone from the store;
	// its refs are cleared and a restore leaves it out
	bool lost = 17;

	// the numeric owner on Unix, which a restore falls back to where user or
	// group names no account; 0 for root and on Windows
	uint32 uid = 18;
	uint32 gid = 19;

	// the extended attributes of a file or directory on Linux and macOS,
	// POSIX ACLs among them, by name, each value held as a stream's content
	repeated Stream xattrs = 20;
	// the inode flags chattr sets on Linux (FS_*_FL)
	uint32 linux_flags = 21;
	// the file flags chflags sets on macOS (st_flags)
	uint32 darwin_flags = 22;

	// the slash-separated path in the commit of the file this one is a hard
	// link to, whose ref is this one's too; sealed like link_target
	bytes hard_link = 23;

	// some of the entry's metadata, its security descriptor, a stream or an
	// extended attribute, is gone from the store and was dropped; its
	// content is kept and restored
	bool metadata_lost = 24;
}

// Stream is one alternate data stream of a file or directory.
message Stream {
	// sealed like the entry's name, within the entry
	bytes name = 1;
	// a File object holding the stream's content
	Ref ref = 2;
	int64 size = 3;
}

// Chunker names the boundary function and parameters that cut a file.
enum Chunker {
	// FastCDC with a 16 KiB minimum, 64 KiB target and 256 KiB maximum
	FASTCDC_64K = 0;
}

message File {
	// an ordered list of file parts
	repeated FilePart parts = 1;

	// an ordered list of references to other file objects, which together
	// hold the file's parts
	repeated Ref splits = 2;

	// the chunker that cut the parts
	Chunker chunker = 3;

	// the whole content of a small file, stored without a blob; sealed
	// under the store key when the store is encrypted
	bytes inline = 4;

	// kept for per-part keys, which convergent encryption needs
	reserved 5;
	reserved "keys";

	// how inline is stored
	Encryption inline_encryption = 6;

	// the content bytes under each split, in order, so a read finds the
	// split holding an offset without loading the others; absent in a file
	// written before splits were measured
	repeated uint64 split_lengths = 7;

	// how many levels of splits lie below this one: 1 when the splits hold
	// parts, more when they are split themselves; 0 without split_lengths
	uint32 split_depth = 8;
}

message FilePart {
	uint64 offset = 1;
	// absent in a hole
	uint64 length = 2;
	// absent in a hole
	Ref ref = 3;
	// a hole: this many zero bytes the file left unallocated, stored
	// without data, which a restore leaves a hole. A file holding one is
	// stored split, so its lengths do not add up for a reader that does not
	// know holes, and it refuses the file.
	uint64 hole = 4;
}
