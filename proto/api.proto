syntax = "proto3";

package proto;

option go_package = "github.com/gobackio/goback/proto";

import "object.proto";
import "ref.proto";
import "tree.proto";
import "commit.proto";
import "presence.proto";
import "retention.proto";
import "google/protobuf/timestamp.proto";

//Put(*proto.Object) error
message PutRequest {
    Stored object = 1;
    // the ref the client computed for object; the server rejects a mismatch
    Ref ref = 2;
    // for a file object: part refs the client did not upload because it
    // assumes the store holds them; the server confirms them before storing
    repeated Ref assumed_refs = 3;
}

message MissingRequest {
    repeated Ref refs = 1;
}

message MissingResponse {
    // the refs asked about that the store does not hold, in the order asked
    repeated Ref missing = 1;
}

message PutObjectsRequest {
    // objects to store as Put stores them, neither commits nor pins; an
    // object may refer to objects of its own message and earlier ones
    repeated Stored objects = 1;
}

message PutObjectsResponse {
    int64 stored = 1;
}

message BeginUploadRequest {
    // the upload file's size in bytes; the store takes no more
    int64 size = 1;
}

message BeginUploadResponse {
    string upload_id = 1;
    // where to PUT the upload file; without it, the file goes to
    // SendUpload
    UploadLocation location = 2;
}

message UploadLocation {
    string url = 1;
    // header must be sent with the request, verbatim
    map<string, string> header = 2;
    google.protobuf.Timestamp expires = 3;
}

message SendUploadRequest {
    // the first message names the upload; every message may carry bytes of
    // the file, in order
    string upload_id = 1;
    bytes data = 2;
}

message SendUploadResponse {
    // the objects the file held, and how many the store didn't hold already
    int64 objects = 1;
    int64 stored = 2;
    // where the upload stands; an older store sets none and answers only
    // once it is done
    UploadStatus status = 3;
}

message UploadStatusRequest {
    repeated string upload_ids = 1;
}

enum UploadState {
    UPLOAD_STATE_UNSPECIFIED = 0;
    // the file hasn't arrived yet
    UPLOAD_STATE_WAITING = 1;
    UPLOAD_STATE_INGESTING = 2;
    UPLOAD_STATE_DONE = 3;
    UPLOAD_STATE_FAILED = 4;
}

message UploadStatus {
    string upload_id = 1;
    UploadState state = 2;
    int64 objects = 3;
    int64 bytes = 4;
    int64 bytes_total = 5;
    string error = 6;
    int64 stored = 7;
    // the commit the file held, as the store stored it, once done
    Stored commit = 8;
    // what the commit references that the store holds nowhere, when it
    // failed for that; the session stays open to send them and the commit
    // again
    repeated Ref missing = 9;
    // the progress phase the store is in while ingesting, such as ingest,
    // check or index; objects counts its units, of objects_total when the
    // phase knows its total
    string phase = 10;
    int64 objects_total = 11;
    // every commit the file held, as the store stored them, in the file's
    // order, once done; commit is the last of them
    repeated Stored commits = 12;
    // what each of the file's commits references that the store holds
    // nowhere, in the file's order, when they failed for that; missing
    // holds all of it
    repeated MissingRefs commits_missing = 13;
}

// MissingRefs is what one commit references that the store holds nowhere.
message MissingRefs {
    repeated Ref refs = 1;
}

// PutCommitsRequest puts several commits of the caller's session as Put
// puts one, together: either all are stored or none is. Each set's commits
// come in the order they were taken.
message PutCommitsRequest {
    repeated Stored commits = 1;
}

message PutCommitsResponse {
    // the commits as stored, in the order sent, whose set ids and receipt
    // times the server assigns; empty when missing is set
    repeated Stored commits = 1;
    // what each commit references that the store holds nowhere, in the
    // order sent, when any commit does; then none was stored and the
    // session stays open to send them and the commits again
    repeated MissingRefs missing = 2;
}

message UploadStatusResponse {
    // one per id asked about, in order
    repeated UploadStatus uploads = 1;
}

message PutResponse {
    // the ref the object was stored under
    Ref ref = 1;
    // the object as stored, returned for commits and pins, whose set id and
    // receipt time the server assigns
    Stored object = 2;
    // what the store does not hold of a file's assumed refs, or of what a
    // commit's session references; when set the object was not stored and
    // the client must upload them and put the object again
    repeated Ref missing = 3;
}

message GetRequest {
    Ref ref = 1;
}

message GetResponse {
    // a store that can address its bytes answers where they are, and one
    // that cannot serves them
    oneof body {
        Stored object = 1;
        Location location = 2;
    }
}

// Location is a plain GET whose body is one object's stored record. It is
// minted to be used at once and expires quickly.
message Location {
    string url = 1;
    // header must be sent with the request, verbatim
    map<string, string> header = 2;
    int64 length = 3;
    google.protobuf.Timestamp expires = 4;
    // at_rest_key opens the record when it is sealed at rest: a Tink
    // keyset for its archive alone
    bytes at_rest_key = 5;
}

// ReadFileRequest names a file object the store references; the
// server streams its parts, except the indexes in skip_parts.
message ReadFileRequest {
    Ref ref = 1;
    repeated uint32 skip_parts = 2;
}

// ReadFileResponse carries either one part's stored object, sealed as it
// was uploaded, at index, or runs of parts whose stored records the
// client fetches itself. Indexes count the parts of the whole file,
// splits flattened.
message ReadFileResponse {
    uint32 index = 1;
    Stored object = 2;
    repeated LocatedRun runs = 3;
}

// LocatedRun is a location whose body holds the stored records of
// several objects, each at its offset into the body.
message LocatedRun {
    Location location = 1;
    repeated LocatedRecord records = 2;
}

// LocatedRecord is where one object's stored record sits in the body of
// a run; index names the object to whoever asked for the run, and in a
// ReadFiles answer file names the file whose part index it is.
message LocatedRecord {
    uint32 index = 1;
    int64 offset = 2;
    int64 length = 3;
    uint32 file = 4;
}

// ReadFilesRequest names up to 1024 file objects the store references.
// The server streams every file object in order and then, unless
// objects_only, the parts of each except the indexes in its skip_parts,
// a part several of the files hold once.
message ReadFilesRequest {
    repeated ReadFilesEntry files = 1;
    bool objects_only = 2;
}

message ReadFilesEntry {
    Ref ref = 1;
    repeated uint32 skip_parts = 2;
}

// ReadFilesResponse carries the object of the file at place file in the
// request, or with part set the stored object of that file's part at
// index, or runs of parts whose records name the file and the part.
message ReadFilesResponse {
    uint32 file = 1;
    Stored object = 2;
    bool part = 3;
    uint32 index = 4;
    repeated LocatedRun runs = 5;
}

message FileInfoRequest {
    string backup_set = 1;
    string path = 2;
    google.protobuf.Timestamp notAfter = 3;
    int32 count = 4;

}

message FileInfoResponse {
    repeated TreeNode files = 1;
}

message ReadDirRequest {
    string backup_set = 1;
    string path = 2;
    google.protobuf.Timestamp notAfter = 3;
}

message ReadDirResponse {
    repeated TreeNode entries = 1;
}

message CommitInfoRequest {
    string backup_set = 1;
    google.protobuf.Timestamp notAfter = 2;
    int32 count = 3;
}

message CommitInfoResponse {
    repeated Commit commits = 1;
    // what the set held at each of commits, in the same order; empty when
    // the store measures nothing
    repeated CommitSize sizes = 2;
}

// CommitSize is how big a set was at one commit, as the store measured it.
message CommitSize {
    // the size of every file, before deduplication and compression;
    // absent for a commit the store has not measured
    optional int64 logical_bytes = 1;
    // how many files there were, absent likewise
    optional int64 files = 2;
}

message LatestCommitRequest {
    string backup_set = 1;
}

message LatestCommitResponse {
    // empty when the set has no commit
    Ref ref = 1;
}

// BeginCommitRequest asks, before a backup run moves bytes, whether the
// caller may commit to the set.
message BeginCommitRequest {
    string backup_set = 1;
    reserved 2;
}

message BeginCommitResponse {
    reserved 1;
    bool allowed = 2;
    // why the commit was refused, empty when allowed
    string reason = 3;
    // the store's write policy for this run; absent when the operator never
    // set one, which leaves the agent's key file in charge
    StorePolicy policy = 4;
    // the run must read every file again, whatever its change detection
    // says, because the store lost content it could not name a path for
    bool rescan = 5;
    // paths whose stored content the store lost: read them again and take
    // no chunk of theirs on trust
    repeated string damaged_paths = 6;
    // how often the store expects a commit of the set, 0 for nothing
    int64 every_seconds = 7;
}

// StorePolicy is a store's write policy: the encryption mode of new
// writes and the presence scope.
message StorePolicy {
    uint32 version = 1;
    string mode = 2;
    reserved 3, 4, 5, 7;
    string presence_scope = 6;
}

message BeginSessionRequest {
    string backup_set = 1;
    // the object a restore session reads; retirement and garbage collection
    // keep it and everything it names while the session lives
    Ref restore = 2;
    // the retention policy backup_set starts with as its own if it is
    // created under this session; a set that exists keeps its own
    RetentionPolicy initial_retention = 3;
}

message BeginSessionResponse {
    // sent as the goback-session metadata header on every call of the session
    string session_id = 1;
    // how long the session survives without a call before the server drops
    // what it did not commit
    int64 lease_seconds = 2;
}

// EndSessionRequest drops whatever the session has not committed
message EndSessionRequest {
    string session_id = 1;
}

message EndSessionResponse {}

// TouchSessionRequest renews a live session's lease without writing
message TouchSessionRequest {
    string session_id = 1;
}

message TouchSessionResponse {}

message GetPresenceRequest {
    // the set whose filter is wanted when the scope is the set
    string backup_set = 1;
    // the digest of the filters the caller holds, as an earlier answer
    // named it; empty when it holds none
    bytes digest = 2;
}

// GetPresenceResponse carries one filter of the caller's scope in pieces:
// messages with the same index concatenate their data. The first message
// names the digest of the filters, presence.Digest of them; it is the only
// one, and carries no filter, when the scope has none or when they are
// unchanged: when the digest is the one the caller sent.
message GetPresenceResponse {
    uint32 index = 1;
    PresenceFilter filter = 2;
    bytes digest = 3;
    bool unchanged = 4;
}

message DeleteCommitRequest {
    Ref ref = 1;
}

message DeleteCommitResponse {}

message UndeleteCommitRequest {
    Ref ref = 1;
}

message UndeleteCommitResponse {}

message ListTrashRequest {
    string backup_set = 1;
    // only commits deleted before this instant; 0 for the newest
    int64 before_ns = 2;
    // at most this many, and then the rest deleted at the last one's
    // instant; 0 for all
    int32 limit = 3;
}

// TrashedCommit is a deleted commit that UndeleteCommit can still bring
// back.
message TrashedCommit {
    Ref ref = 1;
    Commit commit = 2;
    CommitSize size = 3;
    int64 deleted_at_ns = 4;
    // when retirement tombstones it
    int64 expires_at_ns = 5;
}

message ListTrashResponse {
    // newest deleted first
    repeated TrashedCommit commits = 1;
}

enum Period {
    PERIOD_UNSPECIFIED = 0;
    PERIOD_YEAR = 1;
    PERIOD_MONTH = 2;
    PERIOD_DAY = 3;
    PERIOD_HOUR = 4;
}

message CountCommitsRequest {
    string backup_set = 1;
    Period period = 2;
    // the receipt range counted: from_ns inclusive, to_ns exclusive
    int64 from_ns = 3;
    int64 to_ns = 4;
    // IANA name the periods fall in; empty for UTC
    string time_zone = 5;
    // count the deleted commits UndeleteCommit can still bring back
    // instead of the live ones
    bool deleted = 6;
}

// CommitCount is how many commits a period holds and the newest of them.
message CommitCount {
    // the period's first instant
    int64 start_ns = 1;
    int64 count = 2;
    // the newest commit counted in the period: the one received last, and
    // of those received at one instant the one indexed last
    Ref newest = 3;
    // when the store received the newest
    int64 newest_received_at_ns = 4;
}

message CountCommitsResponse {
    // the non-empty periods, oldest first
    repeated CommitCount counts = 1;
}

message GetRetentionRequest {
    string backup_set = 1;
}

message GetRetentionResponse {
    // the set's own policy; unset when it keeps the store's default
    RetentionPolicy policy = 1;
    // the policy the set keeps by
    RetentionPolicy effective = 2;
    // a rebuilt set keeps everything until its policy is set
    bool paused = 3;
}

message SetRetentionRequest {
    string backup_set = 1;
    // unset leaves the set to the store's default
    RetentionPolicy policy = 2;
}

message SetRetentionResponse {
    // the server holds the change until someone confirms it
    bool pending = 1;
}

message DeleteSetRequest {
    string backup_set = 1;
    // erase uses a zero window: the commits are tombstoned by the next
    // retirement run
    bool erase = 2;
}

message DeleteSetResponse {}

message UndeleteSetRequest {
    string backup_set = 1;
}

message UndeleteSetResponse {}

message UnpinRequest {
    Ref pin = 1;
}

message UnpinResponse {}

// EscrowedKey is the store key escrowed under a passphrase, as goback key
// escrow prints it; the store keeps it without being able to open it.
message EscrowedKey {
    string key_id = 1;
    bytes escrowed = 2;
}

message EscrowedKeysRequest {}

message EscrowedKeysResponse {
    repeated EscrowedKey keys = 1;
}

message ListPinsRequest {}

message PinInfo {
    Ref ref = 1;
    Ref target = 2;
    int64 received_at_ns = 3;
    // the labels the pin carries; the store keeps them and never
    // interprets them
    map<string, string> metadata = 4;
}

message ListPinsResponse {
    repeated PinInfo pins = 1;
}

message GetTreeRequest {
    Ref ref = 1;
    // how many directory levels below ref to include; 0 means only ref
    uint32 max_depth = 2;
}

// GetTreeResponse carries either one tree object or runs of trees whose
// stored records the client fetches itself; a record's index is the
// tree's place in the walk.
message GetTreeResponse {
    Ref ref = 1;
    Stored object = 2;
    repeated LocatedRun runs = 3;
}

// ReportScheduleRequest is how often agent_id plans a snapshot of each set
// it writes; it replaces what the agent reported before, so a set it no
// longer lists expects nothing.
message ReportScheduleRequest {
    string agent_id = 1;
    repeated SetSchedule sets = 2;
}

// SetSchedule is how often one set gets a snapshot by its agent's plan.
message SetSchedule {
    string backup_set = 1;
    // every, cron or receiver
    string kind = 2;
    // the most time the plan allows between two snapshots; 0 for a
    // receiver
    int64 longest_gap_seconds = 3;
    // the window the plan's slots move by
    int64 jitter_seconds = 4;
    // how often a receiver commits while its database writes
    int64 commit_every_seconds = 5;
}

message ReportScheduleResponse {}

service Store {
    rpc Put (PutRequest) returns (PutResponse) {}
    // PutCommits commits several commits of the caller's session at once
    rpc PutCommits (PutCommitsRequest) returns (PutCommitsResponse) {}
    // Missing answers which of many refs the store does not hold
    rpc Missing (MissingRequest) returns (MissingResponse) {}
    // PutObjects stores the objects of every message of the stream; a
    // refused object fails the call, with what came before it stored
    rpc PutObjects (stream PutObjectsRequest) returns (PutObjectsResponse) {}
    // BeginUpload opens an upload of one upload file in the caller's
    // session: the store answers where to PUT it, or with nothing, and the
    // file goes to SendUpload
    rpc BeginUpload (BeginUploadRequest) returns (BeginUploadResponse) {}
    // SendUpload streams an upload file BeginUpload answered without a
    // location, and answers once the store has ingested it
    rpc SendUpload (stream SendUploadRequest) returns (SendUploadResponse) {}
    // UploadStatus tells how far the store got ingesting uploads that went
    // to a location
    rpc UploadStatus (UploadStatusRequest) returns (UploadStatusResponse) {}
    // Get serves a commit, tree or file object the store references; blobs
    // are read through ReadFile
    rpc Get (GetRequest) returns (GetResponse) {}
    rpc ReadFile (ReadFileRequest) returns (stream ReadFileResponse) {}
    // ReadFiles reads many small files in one call
    rpc ReadFiles (ReadFilesRequest) returns (stream ReadFilesResponse) {}
    rpc FileInfo(FileInfoRequest) returns (FileInfoResponse) {}
    // ReadDir lists what a set held directly under a path, as of a time
    rpc ReadDir(ReadDirRequest) returns (ReadDirResponse) {}
    rpc CommitInfo(CommitInfoRequest) returns (CommitInfoResponse) {}
    rpc LatestCommit(LatestCommitRequest) returns (LatestCommitResponse) {}
    // GetTree streams a subtree's tree objects breadth-first from the server
    rpc GetTree(GetTreeRequest) returns (stream GetTreeResponse) {}
    // BeginSession opens a backup session; its writes are visible to other
    // callers only once it stores a commit
    // BeginCommit checks the set's state and ownership before a run
    rpc BeginCommit(BeginCommitRequest) returns (BeginCommitResponse) {}
    rpc BeginSession(BeginSessionRequest) returns (BeginSessionResponse) {}
    rpc EndSession(EndSessionRequest) returns (EndSessionResponse) {}
    // TouchSession keeps a session alive between writes, such as while its
    // commit waits for an upload; a session that ended is NotFound
    rpc TouchSession(TouchSessionRequest) returns (TouchSessionResponse) {}
    // GetPresence streams the presence filters of the caller's scope
    rpc GetPresence(GetPresenceRequest) returns (stream GetPresenceResponse) {}

    rpc DeleteCommit(DeleteCommitRequest) returns (DeleteCommitResponse) {}
    rpc UndeleteCommit(UndeleteCommitRequest) returns (UndeleteCommitResponse) {}
    // ListTrash pages through a set's deleted commits, newest deleted first
    rpc ListTrash(ListTrashRequest) returns (ListTrashResponse) {}
    // CountCommits counts a set's commits per year, month, day or hour
    rpc CountCommits(CountCommitsRequest) returns (CountCommitsResponse) {}
    // GetRetention reports a set's own retention policy and the one it
    // keeps by
    rpc GetRetention(GetRetentionRequest) returns (GetRetentionResponse) {}
    // SetRetention replaces a set's own retention policy, or without one
    // leaves the set to the store's default; a server may hold a change
    // until someone confirms it
    rpc SetRetention(SetRetentionRequest) returns (SetRetentionResponse) {}
    rpc DeleteSet(DeleteSetRequest) returns (DeleteSetResponse) {}
    rpc UndeleteSet(UndeleteSetRequest) returns (UndeleteSetResponse) {}
    rpc Unpin(UnpinRequest) returns (UnpinResponse) {}
    rpc ListPins(ListPinsRequest) returns (ListPinsResponse) {}
    // EscrowedKeys returns every escrowed copy of the store key the store
    // keeps, for an agent that holds only the passphrase
    rpc EscrowedKeys(EscrowedKeysRequest) returns (EscrowedKeysResponse) {}
    // ReportSchedule records how often the caller's agent snapshots each
    // set it writes; a store that takes no reports is Unimplemented
    rpc ReportSchedule(ReportScheduleRequest) returns (ReportScheduleResponse) {}
}
