syntax = "proto3";

package proto;

option go_package = "github.com/gobackio/goback/proto";

import "google/protobuf/timestamp.proto";

import "tree.proto";
import "commit.proto";
import "blob.proto";
import "file.proto";
import "pin.proto";
import "policy.proto";
import "ref.proto";
import "encryption.proto";

enum ObjectType {
  INVALID = 0;
  COMMIT = 1;
  TREE = 2;
  FILE = 3;
  BLOB = 4;
  TOMBSTONE = 5;
  PIN = 6;
  POLICY = 7;
}

enum Compression {
  NONE = 0;
  reserved 1;
  ZSTD = 2;
}

message ObjectHeader {
  Ref ref = 1;
  Ref predecessor = 2;
  uint64 size = 3;
  Compression compression = 4;
  google.protobuf.Timestamp timestamp = 5;
  ObjectType type = 6;
  Ref tombstone_for = 7;

  Encryption encryption = 8;
  // identifies the store key under which the object's sealed parts were
  // encrypted; empty for plaintext and convergent objects
  bytes key_id = 9;
  // SHA-256 of the stored bytes, so a copy can be checked without a key
  bytes stored_hash = 10;
  // set on a tombstone written for an erasure: garbage collection rewrites
  // the archives holding the target's objects as soon as its rules allow
  bool erase = 11;
  // identifies the server key under which the stored bytes were sealed at
  // rest; empty when they are stored as the agent sent them
  bytes at_rest_key_id = 12;
}

// Stored is an object as a store keeps it and as it travels: its payload
// compressed with compression and, unless encryption is PLAINTEXT, then
// sealed. A plaintext object's ref is the ref of the payload data
// decompresses to; a sealed blob's is the hash of its key id, codec and
// sealed bytes.
message Stored {
  reserved 1;
  reserved "ref";
  ObjectType type = 2;
  bytes data = 3;
  Compression compression = 4;
  Encryption encryption = 5;
  // the store key a sealed blob, a tree's names or a file's part keys are
  // encrypted under
  bytes key_id = 6;
}

message Object {
  oneof object {
    Commit commit = 1;
    Tree tree = 2;
    File file = 3;
    Blob blob = 4;
    Pin pin = 6;
    Policy policy = 7;
  }

  // the store key under which a tree's names or a file's part keys are
  // encrypted; never part of the hashed payload
  bytes key_id = 10;
  // the object as a store keeps it: all there is of a sealed blob; beside
  // the decoded object, what one that was received or read came as, which
  // a store keeps and serves as it is
  Stored stored = 11;
}
