syntax = "proto3";

package proto;

option go_package = "github.com/gobackio/goback/proto";

import "ref.proto";

message Commit {
  int64 timestamp = 1;
  Ref tree = 2;
  string backup_set = 3;

  // the commit this one was diffed against, empty for a full run
  Ref parent = 4;
  string agent_id = 5;

  // agent wall time in nanoseconds at the start of the walk
  int64 scan_start_ns = 6;

  // a checkpoint written mid-run, superseded by the final commit
  bool partial = 7;

  reserved 8;

  // the store policy version the agent wrote under, 0 for no policy
  uint32 policy_version = 9;

  // the set's id, globally unique; the receiving index assigns it on Put
  // and ignores the client's value
  uint64 set_id = 10;

  // server clock at receipt, nanoseconds since the Unix epoch; ordering,
  // retention and "latest commit" use this, timestamp is display metadata
  int64 received_at_ns = 11;

  // the agent's pre hook quiesced the application and no file was torn or
  // unreadable; never set on a checkpoint
  bool consistent = 12;

  // labels the agent attached; the store keeps them and never interprets them
  map<string, string> metadata = 13;

  // the id of the store key names and contents were sealed under, empty
  // when the commit was written plain; absent on a commit written before
  // it was recorded
  optional bytes key_id = 14;

  // entries of the tree are lost. A client sets it on a commit whose content
  // the store may lack: the store marks what it lacks lost and stores the
  // commit with the trees rewritten, or with the flag cleared when it lacks
  // nothing
  bool incomplete = 15;
}
