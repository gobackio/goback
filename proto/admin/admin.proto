syntax = "proto3";

package admin;

option go_package = "github.com/gobackio/goback/proto/admin";

import "google/protobuf/timestamp.proto";

// Admin is the operator surface of a store server: sets, the store policy
// and job triggers. It is served on its own listener behind the admin
// token, over gRPC.
service Admin {
    rpc ListSets(ListSetsRequest) returns (ListSetsResponse) {}
    rpc DeleteSet(DeleteSetRequest) returns (DeleteSetResponse) {}
    rpc UndeleteSet(UndeleteSetRequest) returns (UndeleteSetResponse) {}

    rpc GetStorePolicy(GetStorePolicyRequest) returns (StorePolicy) {}
    // SetStorePolicy replaces the policy under the next version and may
    // record the operator's acknowledgement that the store key is saved
    rpc SetStorePolicy(SetStorePolicyRequest) returns (StorePolicy) {}

    // GetRetention reports a set's retention, or the store's defaults
    // for an empty set
    rpc GetRetention(GetRetentionRequest) returns (Retention) {}
    // SetRetention changes what GetRetention reports; setting a set's
    // policy resumes retirement paused by a rebuild
    rpc SetRetention(SetRetentionRequest) returns (Retention) {}

    // Retire tombstones every commit whose window has passed
    rpc Retire(RetireRequest) returns (RetireResponse) {}
    rpc CollectGarbage(CollectGarbageRequest) returns (CollectGarbageResponse) {}

    // PutEscrowedKey keeps an escrowed copy of the store key in the
    // store's own storage, never replacing one kept before
    rpc PutEscrowedKey(PutEscrowedKeyRequest) returns (PutEscrowedKeyResponse) {}
}

message BackupSet {
    reserved 1, 3;
    reserved "agent_id";
    string name = 2;
    // active, closing or deleted
    string state = 4;
    // the logical size of the newest live commit
    int64 logical_size = 5;
    // what the set's objects take up in the store, as of the last
    // garbage collection
    int64 physical_size = 6;
    // the size of the distinct content the set's objects carry before
    // compression, as of the last garbage collection
    int64 deduplicated_size = 7;
    // what the set would take up were it the only set, and what of that
    // no other set holds, as of the last garbage collection
    int64 alone_size = 8;
    int64 exclusive_size = 9;
    // the size of every distinct file version the set's untombstoned
    // commits hold, each counted once
    int64 unique_size = 10;
    // the size of the distinct content the set's objects carry before
    // compression were it the only set, as of the last garbage collection
    int64 deduplicated_alone_size = 11;
}

message ListSetsRequest {}

message ListSetsResponse {
    repeated BackupSet sets = 1;
}

message DeleteSetRequest {
    string name = 1;
    bool erase = 2;
}

message DeleteSetResponse {}

message UndeleteSetRequest {
    string name = 1;
}

message UndeleteSetResponse {}

message StorePolicy {
    uint32 version = 1;
    // sealed or none
    string mode = 2;
    reserved 3, 4, 5, 7;
    string presence_scope = 6;
    // when the operator confirmed the store key is saved
    google.protobuf.Timestamp key_acknowledged_at = 8;
}

message GetStorePolicyRequest {}

message SetStorePolicyRequest {
    string mode = 1;
    reserved 2, 3, 4, 6;
    string presence_scope = 5;
    // the operator confirms the store key is saved
    bool acknowledge_key = 7;
}

// RetentionBracket keeps the last commit of each of count UTC calendar
// periods. Brackets run consecutively back from now, each starting with
// the period the one before it ended in.
message RetentionBracket {
    // hourly, daily, weekly, monthly or yearly
    string period = 1;
    reserved 2;
    // zero is the tail, which keeps every older period and so must be last
    int32 count = 3;
}

// RetentionPolicy keeps a commit while a bracket holds it, it is one of
// the last keep_last, or it is younger than keep_within.
message RetentionPolicy {
    int32 keep_last = 1;
    // seconds
    int64 keep_within = 6;
    repeated RetentionBracket brackets = 7;
}

message Retention {
    // the set, empty for the store's defaults
    string set = 1;
    // the policy set here; unset when a set inherits the store's or the
    // store runs the built-in default
    RetentionPolicy policy = 2;
    // the policy in force after inheritance
    RetentionPolicy effective = 3;
    // a rebuilt set keeps everything until a policy is set
    bool paused = 4;
    // the store's window before a deleted commit is tombstoned
    reserved 5;
    int32 trash_days = 6;
}

message GetRetentionRequest {
    string set = 1;
}

message SetRetentionRequest {
    string set = 1;
    // replaces the policy when set
    RetentionPolicy policy = 2;
    // drops the policy: the set inherits, the store uses the built-in
    bool inherit = 3;
    // the store's trash window, ignored for a set
    reserved 4;
    optional int32 trash_days = 5;
}

message RetireRequest {}

message RetireResponse {
    int64 retired = 1;
}

message CollectGarbageRequest {}

message CollectGarbageResponse {
    string report = 1;
}

message PutEscrowedKeyRequest {
    string key_id = 1;
    // the armored age file goback key escrow prints
    string escrowed = 2;
}

message PutEscrowedKeyResponse {}
