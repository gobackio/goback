name: Image

# master pushes ghcr.io/gobackio/goback:latest; a release tag v1.2.3 pushes
# v1.2.3, v1.2 and v1; a prerelease tag pushes only itself. Images are built
# for linux/amd64 and linux/arm64. Setting the repository variable
# DOCKERHUB_REPO (e.g. gobackio/goback) with the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN pushes the same tags to Docker Hub as well.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: vars.DOCKERHUB_REPO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/gobackio/goback
            name=docker.io/${{ vars.DOCKERHUB_REPO }},enable=${{ vars.DOCKERHUB_REPO != '' }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
