name: Image

# master pushes ghcr.io/gobackio/goback:latest; a release tag v1.2.3 pushes
# v1.2.3, v1.2 and v1; a prerelease tag pushes only itself. Images are built
# for linux/amd64 and linux/arm64. Setting the repository variable
# DOCKERHUB_REPO (e.g. gobackio/goback) with the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN pushes the same tags to Docker Hub as well.
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/go.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: vars.DOCKERHUB_REPO != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ghcr.io/gobackio/goback
            name=docker.io/${{ vars.DOCKERHUB_REPO }},enable=${{ vars.DOCKERHUB_REPO != '' }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
