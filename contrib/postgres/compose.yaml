name: goback-postgres

services:
  # copies goback into the volume the Postgres container restores with, on
  # every `docker compose up`
  goback-bin:
    image: goback
    build: ../..
    entrypoint:
      - sh
      - -c
      - cp /usr/bin/goback /opt/goback/goback && mkdir -p /var/lib/goback && chown -R 999:999 /var/lib/goback
    volumes:
      - goback-bin:/opt/goback
      - goback:/var/lib/goback

  postgres:
    image: postgres:17
    depends_on:
      goback-bin:
        condition: service_completed_successfully
    command:
      - -c
      # what pg_wal may grow by while the agent is down
      - max_slot_wal_keep_size=10GB
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials
      GOBACK_CACHE_DIR: /var/lib/goback/cache
    secrets:
      - goback-key
      - gcp-credentials
      - postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - goback-bin:/opt/goback:ro
      - goback:/var/lib/goback

  # runs goback/goback.yaml: a daily base backup, and the WAL streamed through a
  # replication slot over the network, without the data volume
  agent:
    image: goback
    depends_on:
      goback-bin:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    restart: unless-stopped
    # above the agent's shutdown grace, so the last commit finishes
    stop_grace_period: 40s
    command: [agent, run]
    environment:
      GOBACK_CONFIG: /etc/goback/goback.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials
      PGPASSFILE: /run/secrets/goback.pgpass
    secrets:
      - goback-key
      - gcp-credentials
      - goback.pgpass
    volumes:
      # the folder rather than the file: a file mount keeps the version
      # the container started with, so an edit never reaches a reload
      - ./goback:/etc/goback:ro
      - goback-agent:/var/lib/goback
    healthcheck:
      test: [CMD, /usr/bin/goback, agent, status, --check]
      interval: 1m
      timeout: 10s
      start_period: 2m

secrets:
  goback-key:
    file: ./goback.key
  gcp-credentials:
    file: ./gcp-credentials.json
  postgres-password:
    file: ./postgres-password
  goback.pgpass:
    file: ./goback.pgpass

volumes:
  pgdata:
  goback-bin:
  goback:
  goback-agent:
