name: goback-mysql

services:
  # copies goback into the volume the agent runs it from, on every
  # `docker compose up`
  goback-bin:
    image: goback
    build: ../..
    entrypoint:
      - sh
      - -c
      - cp /usr/bin/goback /opt/goback/goback && chown -R 999:999 /var/lib/goback
    volumes:
      - goback-bin:/opt/goback
      - goback-agent:/var/lib/goback

  mysql:
    image: mysql:8.0
    command:
      - --server-id=1
      - --log-bin=binlog
      - --binlog-format=ROW
      - --sync-binlog=1
      - --binlog-expire-logs-seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
    secrets:
      - mysql-root-password
    volumes:
      - mysqldata:/var/lib/mysql

  # runs goback/goback.yaml: a daily dump, and the binlogs received as a replica
  # over the network, without the data volume; from the MySQL image, for its
  # mysqldump
  agent:
    image: mysql:8.0
    depends_on:
      goback-bin:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    restart: unless-stopped
    # above the agent's shutdown grace, so the last commit finishes
    stop_grace_period: 40s
    user: mysql
    entrypoint: [/opt/goback/goback, agent, run]
    environment:
      GOBACK_CONFIG: /etc/goback/goback.yaml
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials
    secrets:
      - goback-key
      - gcp-credentials
      - mysql-client.cnf
    volumes:
      # the folder rather than the file: a file mount keeps the version
      # the container started with, so an edit never reaches a reload
      - ./goback:/etc/goback:ro
      - goback-bin:/opt/goback:ro
      - goback-agent:/var/lib/goback
    healthcheck:
      test: [CMD, /opt/goback/goback, agent, status, --check]
      interval: 1m
      timeout: 10s
      start_period: 2m

secrets:
  goback-key:
    file: ./goback.key
  gcp-credentials:
    file: ./gcp-credentials.json
  mysql-root-password:
    file: ./mysql-root-password
  mysql-client.cnf:
    file: ./mysql-client.cnf

volumes:
  mysqldata:
  goback-bin:
  goback-agent:
